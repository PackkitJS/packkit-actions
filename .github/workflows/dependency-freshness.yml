name: dependency-freshness

# Reusable "Dependabot for the templates". A generator emits dependency versions
# INTO the projects it scaffolds — Dependabot/Renovate can't see those (they're
# strings the generator writes), so this runs the repo's standard `check:freshness`
# script and, when it reports staleness, opens/updates a single tracking issue
# (and closes it once everything is current again). As with the other shared
# workflows, the YAML is language-agnostic — what "freshness" means (npm vs PyPI,
# which deps) lives entirely in each repo's `check:freshness` script.
#
# The CALLER must grant `issues: write` on the calling job, e.g.:
#
#   jobs:
#     freshness:
#       permissions:
#         contents: read
#         issues: write
#       uses: PackkitLabs/packkit-actions/.github/workflows/dependency-freshness.yml@v1
on:
  workflow_call:
    inputs:
      node-version:
        description: Node version.
        type: string
        default: '24'
      runs-on:
        description: Runner image.
        type: string
        default: ubuntu-latest
      issue-title:
        description: Title of the single tracking issue this manages.
        type: string
        default: Stale template dependencies
      issue-label:
        description: Label applied to the tracking issue (best-effort).
        type: string
        default: dependencies

jobs:
  freshness:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci

      # The standard entrypoint. Exit 0 = fresh; non-zero = something is stale.
      # continue-on-error so a stale report drives issue management, not a red run.
      - name: Check dependency freshness
        id: check
        run: |
          npm run check:freshness | tee report.md
          echo "stale=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Open or update the tracking issue when stale
        if: steps.check.outputs.stale != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "_Auto-generated by the dependency-freshness workflow. These are versions this generator writes into the projects it scaffolds — bump them in the templates, then re-verify (integration)._"
            echo
            cat report.md
          } > issue.md
          NUM=$(gh issue list --state open --search "in:title ${{ inputs.issue-title }}" --json number --jq '.[0].number' 2>/dev/null)
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body-file issue.md
          else
            gh issue create --title "${{ inputs.issue-title }}" --body-file issue.md --label "${{ inputs.issue-label }}" 2>/dev/null \
              || gh issue create --title "${{ inputs.issue-title }}" --body-file issue.md
          fi

      - name: Close the tracking issue when everything is fresh
        if: steps.check.outputs.stale == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --state open --search "in:title ${{ inputs.issue-title }}" --json number --jq '.[0].number' 2>/dev/null)
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "All template dependencies are current — closing automatically."
          fi
