name: generator-integration

# Reusable end-to-end integration for a generator repo: it provisions the runtimes
# a generated project needs, then runs the standard `npm run test:integration`
# entrypoint. As with generator-ci, the shared YAML provisions runtimes but never
# encodes what the test does — that lives in each repo's `test:integration` script
# (e.g. create-packkit-py scaffolds a project and runs uv/pytest/ruff/mypy on it).
#
#   jobs:
#     integration:
#       uses: PackkitLabs/packkit-actions/.github/workflows/generator-integration.yml@v1
#       with:
#         setup-uv: true          # Python generators
#         setup-go: true          # Go generators
#
# Node is always provisioned (these generators are npm-scripted). Non-Node runtimes
# are opt-in flags so one workflow serves JS, Python, Go, and future language generators.
on:
  workflow_call:
    inputs:
      node-version:
        description: Node version.
        type: string
        default: '24'
      runs-on:
        description: Runner image.
        type: string
        default: ubuntu-latest
      setup-uv:
        description: Install uv (Astral) — for Python generators. uv manages its own Python.
        type: boolean
        default: false
      uv-version:
        description: uv version to install when setup-uv is true.
        type: string
        default: latest
      setup-go:
        description: Install Go — for Go generators. Provides `go`, `gofmt`, `go vet`.
        type: boolean
        default: false
      go-version:
        description: Go version to install when setup-go is true.
        type: string
        default: stable

jobs:
  integration:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - if: ${{ inputs.setup-uv }}
        # Third-party action → SHA-pinned (setup-uv publishes no moving major tag).
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: ${{ inputs.uv-version }}
          # A generator repo has no root pyproject to cache against — each integration
          # run scaffolds fresh throwaway projects — so caching only warns. Disable it.
          enable-cache: false
      - if: ${{ inputs.setup-go }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          # Same reasoning as uv: the generator repo has no go.mod of its own; each run
          # scaffolds throwaway Go projects, so the module cache has nothing stable to key on.
          cache: false
      # The single standard entrypoint. Each generator's `test:integration` scaffolds
      # a project with its real CLI and exercises the generated project's own tooling.
      - run: npm run test:integration
